[project]
name = "trpii-fraude"
version = "0.1.0"
description = "TP Deteccion de Fraude con ML - Taller de Resolucion de Problemas II (Universidad Austral)"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "catboost>=1.2.10",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyod>=3.6.7",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
